{% extends "base.html" %}

{% block title %}Delete draft form · Dynamic Forms Platform{% endblock %}

{% block content %}
<header class="page-header">
    <div>
        <p class="eyebrow">Form authoring</p>
        <h1>Delete draft form</h1>
        <p>Delete “{{ managed_form.title }}”?</p>
    </div>
</header>

<section class="auth-card account-summary">
    <p>Only draft forms can be hard-deleted in the normal product flow.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="button button--primary" type="submit">Delete draft</button>
            <a class="button button--secondary" href="{% url 'forms:detail' managed_form.id %}">
                Cancel
            </a>
        </div>
    </form>
</section>
{% endblock %}

{% if messages %}
    <div class="message-list" aria-label="System messages">
        {% for message in messages %}
            <div
                class="message{% if message.tags %} message--{{ message.tags }}{% endif %}"
                role="{% if 'error' in message.tags %}alert{% else %}status{% endif %}"
                data-message
            >
                <div class="message__content">{{ message }}</div>
                <button
                    class="message__dismiss"
                    type="button"
                    aria-label="Dismiss message"
                    data-dismiss-message
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}

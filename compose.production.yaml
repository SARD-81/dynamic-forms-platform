# Separate production contract. compose.yaml remains the development entrypoint.
x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set explicit allowed hosts}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set explicit origins}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  DJANGO_TRUST_NGINX_PROXY: "true"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-2}
  READINESS_DB_QUERY_TIMEOUT_MS: ${READINESS_DB_QUERY_TIMEOUT_MS:-1000}
  REDIS_CACHE_URL: redis://redis:6379/0
  REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-1}
  CELERY_BROKER_URL: redis://redis:6379/1
  DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:?Set DJANGO_EMAIL_HOST}
  DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:?Set DJANGO_EMAIL_PORT}
  DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:?Set DJANGO_EMAIL_HOST_USER}
  DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:?Set DJANGO_EMAIL_HOST_PASSWORD}
  DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
  DJANGO_EMAIL_TIMEOUT: ${DJANGO_EMAIL_TIMEOUT:?Set DJANGO_EMAIL_TIMEOUT}
  DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:?Set DJANGO_DEFAULT_FROM_EMAIL}

x-app: &app
  image: dynamic-forms-production:${PRODUCTION_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.production
  environment: *app-environment
  init: true

services:
  app-init:
    <<: *app
    command:
      - sh
      - -ec
      - |
        python src/manage.py migrate --noinput
        python src/manage.py collectstatic --noinput
        python src/manage.py production_preflight
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: ["daphne", "--access-log", "/dev/null", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    volumes:
      - static_data:/app/staticfiles:ro
    depends_on:
      app-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),timeout=2); s.close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  nginx:
    build:
      context: docker/nginx
    environment:
      NGINX_PROXY_SCHEME: ${NGINX_PROXY_SCHEME:-http}
      NGINX_INGRESS_BIND_ADDRESS: ${NGINX_BIND_ADDRESS:-127.0.0.1}
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${PRODUCTION_HTTP_PORT:-8080}:80"
    volumes:
      - static_data:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    <<: *app
    command: ["celery", "--workdir=src", "-A", "config", "worker", "--loglevel=INFO"]
    depends_on:
      app-init:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-beat:
    <<: *app
    command: ["celery", "--workdir=src", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      app-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_data:

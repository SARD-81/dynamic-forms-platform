name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DJANGO_SECRET_KEY: "ci-only-not-a-real-secret"
  DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
  POSTGRES_DB: "dynamic_forms_ci"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: "127.0.0.1"
  POSTGRES_PORT: "5432"
  REDIS_CACHE_URL: "redis://127.0.0.1:6379/0"
  CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
  CHANNEL_LAYER_URL: "redis://127.0.0.1:6379/2"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dynamic_forms_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dynamic_forms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run test suite
        run: pytest

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dynamic_forms_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dynamic_forms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Django system check
        run: python src/manage.py check

      - name: Check migration drift
        run: python src/manage.py makemigrations --check --dry-run

      - name: Validate Docker Compose development config
        run: docker compose --env-file .env.example config --quiet

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare smoke environment
        run: |
          cp .env.example .env
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-docker-smoke-secret-key/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-docker-smoke-password/' .env

      - name: Build and start full development topology
        run: docker compose --env-file .env up --build -d

      - name: Wait for containerized Django readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ > /tmp/api-root.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env ps
          docker compose --env-file .env logs web
          exit 1

      - name: Verify all five development services are running
        run: |
          running_services="$(docker compose --env-file .env ps --services --status running)"
          for service in web postgres redis celery-worker celery-beat; do
            echo "$running_services" | grep -Fxq "$service"
          done

      - name: Verify Celery worker and scheduled-report task registration
        run: |
          docker compose --env-file .env exec -T celery-worker \
            celery --workdir=src -A config inspect ping --timeout=10
          docker compose --env-file .env exec -T celery-worker \
            celery --workdir=src -A config inspect registered --timeout=10 \
            | grep -q "apps.reports.tasks.dispatch_due_report_subscriptions"

      - name: Smoke critical HTML, API and OpenAPI routes
        run: |
          curl --fail --silent http://127.0.0.1:8000/accounts/login/ > /dev/null
          curl --fail --silent 'http://127.0.0.1:8000/api/schema/?format=json' > /tmp/schema.json
          python - <<'PY'
          import json

          with open('/tmp/api-root.json', encoding='utf-8') as handle:
              api_root = json.load(handle)
          with open('/tmp/schema.json', encoding='utf-8') as handle:
              schema = json.load(handle)

          assert api_root['version'] == '1.0.0'
          required_paths = {
              '/api/v1/accounts/login/',
              '/api/v1/categories/',
              '/api/v1/forms/',
              '/api/v1/forms/{form_id}/report/',
              '/api/v1/processes/',
              '/api/v1/processes/{process_id}/report/',
              '/api/v1/reports/subscriptions/',
              '/api/v1/public/forms/{public_id}/submissions/',
              '/api/v1/public/processes/{public_id}/runs/',
          }
          missing = required_paths.difference(schema['paths'])
          assert not missing, f'Missing OpenAPI paths: {sorted(missing)}'
          PY

      - name: Show full topology status
        run: docker compose --env-file .env ps

      - name: Tear down smoke topology
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans

  production-smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: gate4-production
      DJANGO_SECRET_KEY: ci-only-production-smoke-placeholder
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8080
      DJANGO_SECURE_SSL_REDIRECT: "false"
      POSTGRES_DB: gate4_smoke
      POSTGRES_USER: gate4_smoke
      POSTGRES_PASSWORD: ci-only-production-db-placeholder
      DJANGO_EMAIL_HOST: smtp.invalid
      DJANGO_EMAIL_PORT: "587"
      DJANGO_EMAIL_HOST_USER: ci-placeholder
      DJANGO_EMAIL_HOST_PASSWORD: ci-only-smtp-placeholder
      DJANGO_EMAIL_TIMEOUT: "2"
      DJANGO_DEFAULT_FROM_EMAIL: ci@example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare disposable production environment
        run: cp .env.production.example .env.production
      - name: Validate production Compose
        run: docker compose --env-file .env.production -f compose.production.yaml config --quiet
      - name: Build and start deterministic production topology
        run: timeout 240 docker compose --env-file .env.production -f compose.production.yaml up --build -d
      - name: Wait on public Nginx readiness boundary
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent --max-time 8 http://127.0.0.1:8080/health/ready/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify production settings, init, static, internal services and preflight
        run: python scripts/verify_production_runtime.py --env-file .env.production --project-name gate4-production
      - name: Verify public login, API, OpenAPI, health and exact static content
        run: |
          asset_sha="$(sha256sum src/apps/core/static/core/app.css | cut -d ' ' -f 1)"
          python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
            --liveness-path /health/live/ --readiness-path /health/ready/ \
            --static-path /static/core/app.css --static-sha256 "$asset_sha" --timeout 5 --require-all
      - name: Verify home reachability and private/source file denial
        run: |
          for private_path in /static/.env /static/config/settings/production.py /.env /src/manage.py; do
            python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
              --login-path / --liveness-path /health/live/ --readiness-path /health/ready/ \
              --static-path "$private_path" --static-status 404 --timeout 5 --require-all
          done
      - name: Verify static replacement on a preserved volume
        run: |
          docker compose --env-file .env.production -f compose.production.yaml run --rm --no-deps app-init \
            python -c "from pathlib import Path; import os; p=Path('/app/staticfiles/core/app.css'); p.write_text('stale asset'); os.utime(p,(2000000000,2000000000)); Path('/app/staticfiles/core/obsolete-gate4.css').write_text('obsolete asset')"
          timeout 60 docker compose --env-file .env.production -f compose.production.yaml up \
            --no-deps --force-recreate --abort-on-container-exit --exit-code-from app-init app-init
          asset_sha="$(sha256sum src/apps/core/static/core/app.css | cut -d ' ' -f 1)"
          python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
            --liveness-path /health/live/ --readiness-path /health/ready/ \
            --static-path /static/core/app.css --static-sha256 "$asset_sha" --timeout 5 --require-all
          python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
            --liveness-path /health/live/ --readiness-path /health/ready/ \
            --static-path /static/core/obsolete-gate4.css --static-status 404 --timeout 5 --require-all
      - name: Verify bounded readiness when PostgreSQL is unavailable
        run: |
          docker compose --env-file .env.production -f compose.production.yaml stop postgres
          python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
            --liveness-path /health/live/ --readiness-path /health/ready/ --readiness-status 503 \
            --static-path /static/core/app.css --timeout 5 --require-all
          docker compose --env-file .env.production -f compose.production.yaml start postgres
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 8 http://127.0.0.1:8080/health/ready/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify bounded readiness when Redis is unavailable
        run: |
          docker compose --env-file .env.production -f compose.production.yaml stop redis
          python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
            --liveness-path /health/live/ --readiness-path /health/ready/ --readiness-status 503 \
            --static-path /static/core/app.css --timeout 5 --require-all
          docker compose --env-file .env.production -f compose.production.yaml start redis
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 8 http://127.0.0.1:8080/health/ready/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify secure redirects and rejection of forged forwarded protocol
        run: |
          DJANGO_SECURE_SSL_REDIRECT=true docker compose --env-file .env.production -f compose.production.yaml up -d web
          for attempt in {1..20}; do
            if python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
              --header X-Forwarded-Proto:https --login-status 301 --api-status 301 --schema-status 301 \
              --liveness-path /health/live/ --liveness-status 301 \
              --readiness-path /health/ready/ --readiness-status 301 \
              --static-path /static/core/app.css --timeout 5 --require-all; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Restore HTTP smoke override and reverify public readiness
        run: |
          docker compose --env-file .env.production -f compose.production.yaml up -d web
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 8 http://127.0.0.1:8080/health/ready/ > /dev/null; then
              python scripts/verify_production.py --base-url http://127.0.0.1:8080 \
                --liveness-path /health/live/ --readiness-path /health/ready/ \
                --static-path /static/admin/css/base.css --timeout 5 --require-all
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Secret-safe production failure diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.production -f compose.production.yaml ps -a
          docker compose --env-file .env.production -f compose.production.yaml logs --tail=80 app-init web nginx celery-worker celery-beat
      - name: Always tear down production containers and volumes
        if: always()
        run: docker compose --env-file .env.production -f compose.production.yaml down -v --remove-orphans

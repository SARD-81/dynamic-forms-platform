[project]
name = "dynamic-forms-platform"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2.17,<5.3",
    "djangorestframework>=3.18.1,<3.19",
    "channels[daphne]>=4.3.2,<4.4",
    "psycopg[binary]>=3.3.6,<3.4",
    "celery[redis]>=5.6.3,<5.7",
    "python-dotenv>=1.2.3,<1.3",
    "drf-spectacular==0.27.1",
    # Vercel's queue adapter dynamically imports the AnyIO asyncio backend.
    "anyio>=4.12,<5",
    "vercel==0.11.6",
    "vercel-celery==0.7.8",
]

[tool.vercel]
entrypoint = "vercel_app:application"

[[tool.vercel.subscribers]]
entrypoint = "worker:app"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src/apps", "tests"]
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/apps", "src/config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src/apps", "tests"]
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/apps", "src/config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
